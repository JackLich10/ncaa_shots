name: ncaa_shots Scheduled Run
on:
  schedule:
    - cron: "0 9 * 11,12,1,2,3,4 *"
  workflow_dispatch:

jobs:
    reporter:
        runs-on: ubuntu-latest
        name: Scraping ncaa.org live shots
        steps:
          - uses: actions/checkout@v3
          - name: Set up R ${{ matrix.r-version }}
            uses: r-lib/actions/setup-r@v2
            with:
              r-version: 4.2.3
              http-user-agent: ${{ matrix.config.http-user-agent }}
              use-public-rspm: true
          - name: Install libcurl
            run: sudo apt-get install libcurl4-openssl-dev libssl-dev libicu-dev libxml2-dev
          - uses: r-lib/actions/setup-pandoc@v2
          - name: Install base dependencies
            run: |
              Rscript -e 'install.packages(c("dplyr","collapse","remotes","stringdist","readr","rvest","stringr","purrr","here","tidyr","XML","optparse"))'
            env:
              GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
          - name: womens
            run: Rscript ./R/scrape.R --gender womens
          - name: mens
            run: Rscript ./R/scrape.R --gender mens
          - name: Commit files
            run: |
              git config --local user.email "action@github.com"
              git config --local user.name "Github Action"
              git pull
              git add ./data/.
              git commit -m "Updated NCAA shots after latest bot run." || echo "No changes to commit"
          - name: Push updated files
            uses: ad-m/github-push-action@master
            with:
              github_token: ${{ secrets.GITHUB_TOKEN }}
